<svg id="raFlow" class="ra-flow" viewBox="0 0 806 600" role="img"
     aria-label="A rule fires when a channel breaches its 2-sigma band; Claude reads the artifact and a signed analysis lands.">
  <defs>
    <filter id="raf-glow-gold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#c6a664" flood-opacity="0.4"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="raf-glow-iron" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feFlood flood-color="#c05a3f" flood-opacity="0.6"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="raf-glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feFlood flood-color="#5e8570" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="raf-glow-blue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#7fa4b5" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="raf-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fa4b5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fa4b5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fa4b5" stop-opacity="0"/>
    </linearGradient>
    <marker id="raf-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#c6a664"/>
    </marker>
  </defs>

  <!-- decorative frame (no opaque fill — page bg shows through in both themes) -->
  <rect x="10" y="10" width="786" height="580" fill="none" stroke="#c6a664" stroke-opacity="0.26"/>
  <rect x="16" y="16" width="774" height="568" fill="none" stroke="#c6a664" stroke-opacity="0.11"/>

  <!-- header -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
    <text x="40" y="52" font-size="11" letter-spacing="3" fill="#c6a664">RULES &amp; ANALYSIS</text>
    <text class="serif" x="40" y="86" font-size="23">A rule fires. An analysis lands.</text>
    <text class="serif" x="448" y="86" font-size="23" fill-opacity="0.5" font-style="italic">The trail writes itself.</text>
  </g>

  <!-- ═══ RULE CARD (left) ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-36,0" to="0,0"
        dur="0.9s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect class="card" x="36" y="118" width="214" height="300" rx="3"/>
      <rect x="36" y="118" width="214" height="300" rx="3" fill="none" stroke="#c6a664" stroke-opacity="0.3"/>
      <text x="54" y="144" font-size="9.5" letter-spacing="1.5" fill="#c6a664" fill-opacity="0.75">THE RULE · YAML</text>
      <text x="54" y="162" font-size="10" fill="#7fa4b5">rules/thermal/temp_drift.yaml</text>
      <line class="ink-line" x1="54" y1="172" x2="232" y2="172" stroke-opacity="0.1"/>
      <g font-size="11">
        <text x="54" y="196"><tspan fill="#c6a664">id</tspan><tspan fill-opacity="0.5">:       </tspan><tspan>temp_drift_2σ</tspan></text>
        <text x="54" y="214"><tspan fill="#c6a664">kind</tspan><tspan fill-opacity="0.5">:     </tspan><tspan>regression</tspan></text>
        <text x="54" y="232"><tspan fill="#c6a664">severity</tspan><tspan fill-opacity="0.5">: </tspan><tspan fill="#c05a3f" font-weight="700">critical</tspan></text>
        <text x="54" y="258" fill="#c6a664">assert:</text>
        <text x="68" y="276"><tspan fill="#c6a664">type</tspan><tspan fill-opacity="0.5">:      </tspan><tspan>band</tspan></text>
        <text x="68" y="294"><tspan fill="#c6a664">baseline</tspan><tspan fill-opacity="0.5">:  </tspan><tspan>golden_run</tspan></text>
        <text x="68" y="312"><tspan fill="#c6a664">tolerance</tspan><tspan fill-opacity="0.5">: </tspan><tspan>2σ</tspan></text>
        <text x="68" y="330"><tspan fill="#c6a664">channel</tspan><tspan fill-opacity="0.5">:   </tspan><tspan>temp_c</tspan></text>
      </g>
      <text x="54" y="368" font-size="9" fill-opacity="0.4"># pinned to plan-thermal-v4</text>
      <text x="54" y="382" font-size="9" fill-opacity="0.4"># versioned with the test plan</text>
      <rect x="54" y="394" width="12" height="12" rx="2" fill="#c6a664" fill-opacity="0.14" stroke="#c6a664" stroke-opacity="0.4"/>
      <text x="76" y="404" font-size="9.5" fill="#c6a664">declarative · reproducible</text>
    </g>
  </g>

  <!-- arrow rule → chart -->
  <line x1="254" y1="252" x2="286" y2="252" stroke="#c6a664" stroke-opacity="0.5" stroke-width="1.5"
        marker-end="url(#raf-arrow)" stroke-dasharray="36" stroke-dashoffset="36">
    <animate attributeName="stroke-dashoffset" values="36;0" dur="0.5s" begin="1.9s" fill="freeze"/>
  </line>

  <!-- ═══ BREACH CHART (center) ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.0s" fill="freeze"/>
    <rect class="plot-fill" x="292" y="128" width="194" height="290" rx="3"/>
    <rect x="292" y="128" width="194" height="290" rx="3" fill="none" stroke="#c6a664" stroke-opacity="0.16"/>
    <text x="308" y="150" font-size="9.5" letter-spacing="1.4" fill="#c6a664" fill-opacity="0.75">CHANNEL 3 · SOAK</text>

    <!-- plot x 308..472 · baseline y=272 · +2σ y=224 · −2σ y=320 -->
    <rect x="308" y="224" width="164" height="96" fill="#c6a664" fill-opacity="0.07">
      <animate attributeName="fill-opacity" values="0.07;0.12;0.07" dur="5s" begin="10s" repeatCount="indefinite"/>
    </rect>
    <line x1="308" y1="224" x2="472" y2="224" stroke="#c6a664" stroke-opacity="0.4" stroke-dasharray="4 4"
          stroke-dashoffset="164"><animate attributeName="stroke-dashoffset" values="164;0" dur="0.8s" begin="2.5s" fill="freeze"/></line>
    <line x1="308" y1="320" x2="472" y2="320" stroke="#c6a664" stroke-opacity="0.4" stroke-dasharray="4 4"
          stroke-dashoffset="164"><animate attributeName="stroke-dashoffset" values="164;0" dur="0.8s" begin="2.5s" fill="freeze"/></line>
    <line x1="308" y1="272" x2="472" y2="272" stroke="#c6a664" stroke-opacity="0.7" stroke-width="1.3"
          stroke-dasharray="164" stroke-dashoffset="164" filter="url(#raf-glow-gold)">
      <animate attributeName="stroke-dashoffset" values="164;0" dur="1s" begin="2.6s" fill="freeze"/>
    </line>
    <text x="312" y="266" font-size="8" fill="#c6a664" fill-opacity="0.85">golden run</text>
    <text x="468" y="221" font-size="8" text-anchor="end" fill="#c6a664" fill-opacity="0.7">+2σ</text>
    <text x="468" y="332" font-size="8" text-anchor="end" fill="#c6a664" fill-opacity="0.7">−2σ</text>

    <!-- signal, breaches +2σ near x=452 -->
    <polyline points="308,286 328,281 350,287 372,274 394,262 416,246 438,230 452,222 462,206 472,202"
      fill="none" stroke="#7fa4b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      filter="url(#raf-glow-blue)" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="1.7s" begin="3.2s" fill="freeze"
               calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </polyline>
    <text x="308" y="342" font-size="8" fill-opacity="0.4">t=0</text>
    <text x="430" y="342" font-size="8" fill="#c05a3f">t=812s</text>

    <!-- breach marker -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.9s" fill="freeze"/>
      <line x1="452" y1="222" x2="452" y2="332" stroke="#c05a3f" stroke-opacity="0.5" stroke-dasharray="3 3"/>
      <circle cx="452" cy="222" r="4.5" fill="#c05a3f" filter="url(#raf-glow-iron)">
        <animate attributeName="r" values="4.5;7;4.5" dur="1.6s" begin="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="452" cy="222" r="4.5" fill="none" stroke="#c05a3f" stroke-opacity="0.8">
        <animate attributeName="r" from="4.5" to="18" dur="1.4s" begin="4.9s;10s;12s;14s" fill="freeze"/>
        <animate attributeName="stroke-opacity" from="0.8" to="0" dur="1.4s" begin="4.9s;10s;12s;14s" fill="freeze"/>
      </circle>
      <rect x="401" y="169" width="86" height="23" rx="4" fill="#c05a3f" fill-opacity="0.16" stroke="#c05a3f" stroke-opacity="0.6"/>
      <text x="444" y="184.5" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c05a3f">+4.2°C ⚠</text>
    </g>
  </g>

  <!-- RULE FIRED badge -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.1s" fill="freeze"/>
    <g transform="translate(389,446)">
      <animateTransform attributeName="transform" type="scale" from="0.85" to="1" dur="0.4s" begin="5.1s" fill="freeze"
        additive="sum" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="-68" y="-14" width="136" height="28" rx="14" fill="#c05a3f" fill-opacity="0.14" stroke="#c05a3f" stroke-opacity="0.7"/>
      <circle cx="-43" cy="0" r="3.5" fill="#c05a3f">
        <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.2s" begin="10s" repeatCount="indefinite"/>
      </circle>
      <text x="-30" y="3.5" font-size="10.5" letter-spacing="1.5" fill="#c05a3f" font-weight="700">RULE FIRED</text>
    </g>
  </g>

  <!-- ═══ CLAUDE reads (bridge) ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="5.6s" fill="freeze"/>
    <line x1="486" y1="272" x2="552" y2="272" stroke="url(#raf-beam)" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" begin="5.6s" repeatCount="indefinite"/>
    </line>
    <circle cx="519" cy="272" r="13" fill="none" stroke="#7fa4b5" stroke-opacity="0.85" stroke-width="1.4" filter="url(#raf-glow-blue)"/>
    <circle cx="519" cy="272" r="13" fill="none" stroke="#7fa4b5" stroke-opacity="0.4">
      <animate attributeName="r" from="13" to="24" dur="2s" begin="5.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" from="0.5" to="0" dur="2s" begin="5.6s" repeatCount="indefinite"/>
    </circle>
    <text x="519" y="277" font-size="12" text-anchor="middle" fill="#7fa4b5">✦</text>
    <text x="519" y="300" font-size="8" text-anchor="middle" letter-spacing="0.5" fill="#7fa4b5" fill-opacity="0.85">claude</text>
  </g>

  <!-- ═══ ANALYSIS CARD (right) ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="6.4s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="36,0" to="0,0"
        dur="0.9s" begin="6.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect class="card" x="552" y="118" width="214" height="300" rx="3"/>
      <rect x="552" y="118" width="214" height="300" rx="3" fill="none" stroke="#7fa4b5" stroke-opacity="0.32"/>
      <text x="570" y="144" font-size="9.5" letter-spacing="1.4" fill="#7fa4b5" fill-opacity="0.85">THE ANALYSIS · JSON</text>
      <text x="570" y="162" font-size="10" fill="#7fa4b5">run-…140311/analysis.json</text>
      <line class="ink-line" x1="570" y1="172" x2="748" y2="172" stroke-opacity="0.1"/>
      <g font-size="10.5">
        <text x="570" y="192"><tspan fill="#7fa4b5">verdict</tspan><tspan fill-opacity="0.5">:  </tspan><tspan fill="#c05a3f" font-weight="700">"failed"</tspan></text>
        <text x="570" y="210" fill="#7fa4b5">rules_fired:</text>
        <text x="584" y="226">temp_drift_2σ,</text>
        <text x="584" y="242">stall_recovery_slow</text>
        <text x="570" y="264" fill="#7fa4b5">summary:</text>
      </g>
      <text class="serif" x="570" y="282" font-size="11.5" fill-opacity="0.85">Channel 3 crossed +4.2°C</text>
      <text class="serif" x="570" y="298" font-size="11.5" fill-opacity="0.85">above baseline at t=812s,</text>
      <text class="serif" x="570" y="314" font-size="11.5" fill-opacity="0.85">outside the 2σ band.</text>
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="8.4s" fill="freeze"/>
        <rect x="568" y="326" width="182" height="34" rx="3" fill="#7fa4b5" fill-opacity="0.08" stroke="#7fa4b5" stroke-opacity="0.3"/>
        <text x="576" y="340" font-size="9" fill="#7fa4b5">evidence:</text>
        <text x="576" y="354" font-size="9.5" fill-opacity="0.8">channels.ndjson · L8144–8210</text>
      </g>
    </g>
  </g>

  <!-- ═══ SIGNED seal ═══ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="9.0s" fill="freeze"/>
    <g transform="translate(659,446)">
      <animateTransform attributeName="transform" type="scale" from="1.35" to="1" dur="0.45s" begin="9.0s" fill="freeze"
        additive="sum" calcMode="spline" keySplines="0.34 1.3 0.5 1" keyTimes="0;1"/>
      <rect x="-93" y="-14" width="186" height="28" rx="14" fill="#5e8570" fill-opacity="0.14" stroke="#5e8570" stroke-opacity="0.75" filter="url(#raf-glow-green)"/>
      <circle cx="-67" cy="0" r="6.5" fill="#5e8570" fill-opacity="0.25" stroke="#5e8570" stroke-opacity="0.9"/>
      <path d="M -70 0 l 2 2.4 l 3.8 -4.8" fill="none" stroke="#5e8570" stroke-width="1.6" stroke-linecap="round"/>
      <text x="-51" y="3.5" font-size="10" letter-spacing="1" fill="#5e8570" font-weight="700">SIGNED · IMMUTABLE</text>
    </g>
  </g>

  <!-- caption -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="9.2s" fill="freeze"/>
    <text class="serif" x="403" y="474" font-size="13" text-anchor="middle" fill-opacity="0.6" font-style="italic">Declarative rule, grounded analysis, a permalinked record that will not move.</text>
    <line x1="283" y1="490" x2="523" y2="490" stroke="#c6a664" stroke-opacity="0.3"/>
  </g>
</svg>
