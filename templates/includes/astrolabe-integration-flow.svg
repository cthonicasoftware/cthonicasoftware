<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="100%"
     role="img" aria-label="Astrolabe to Orrery integration flow diagram"
     class="lazy-svg">
  <defs>
    <style>
      .svg-title { font-family: 'EB Garamond', Georgia, serif; }
      .svg-code  { font-family: 'Cascadia Code', 'Caskadyia Cove Nerd Font', 'Caskaydia Cove Nerd Font', 'CaskaydiaCove Nerd Font', monospace; }
      .svg-label { font-family: 'EB Garamond', Georgia, serif; }

      /* ── Light mode overrides ── */
      :root:not(.dark) .aif-zone-v       { fill: #3a5e47; fill-opacity: 0.06; }
      :root:not(.dark) .aif-zone-c       { fill: #8b6020; fill-opacity: 0.05; }

      :root:not(.dark) .aif-box-bg-v     { fill: #3a5e47; fill-opacity: 0.08; }
      :root:not(.dark) .aif-box-bg-c     { fill: #8b6020; fill-opacity: 0.07; }
      :root:not(.dark) .aif-box-border-v { stroke: #3a5e47; stroke-opacity: 0.38; filter: none; }
      :root:not(.dark) .aif-box-border-c { stroke: #8b6020; stroke-opacity: 0.48; filter: none; }

      :root:not(.dark) .aif-step-bg      { fill: #8b6020; fill-opacity: 0.06; }
      :root:not(.dark) .aif-tick         { stroke: #8b6020; }

      :root:not(.dark) .aif-title-v      { fill: #2a1a06; }
      :root:not(.dark) .aif-title-c      { fill: #6b4a18; }
      :root:not(.dark) .aif-sub-v        { fill: #3a5e47; fill-opacity: 1; }
      :root:not(.dark) .aif-sub-c        { fill: #8b6020; fill-opacity: 1; }
      :root:not(.dark) .aif-desc         { fill: #5c4228; }
      :root:not(.dark) .aif-num          { fill: #8b6020; fill-opacity: 0.60; }
      :root:not(.dark) .aif-step-num     { fill: #8b6020; fill-opacity: 0.55; }
      :root:not(.dark) .aif-step-text    { fill: #5c4228; }

      :root:not(.dark) .aif-arrow-v      { stroke: #3a5e47; stroke-opacity: 0.65; }
      :root:not(.dark) .aif-arrow-c      { stroke: #8b6020; stroke-opacity: 0.80; }
      :root:not(.dark) .aif-dot-c        { fill: #8b6020; }
      :root:not(.dark) .aif-pulse-v      { stroke: #3a5e47; }
      :root:not(.dark) .aif-idle-fill    { fill: #8b6020; }
    </style>

    <filter id="gv" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#5e8570" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="gc" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#C9A874" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="gcs" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#C9A874" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="av" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5e8570" opacity="0.8"/>
    </marker>
    <marker id="ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#C9A874"/>
    </marker>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="white" stop-opacity="0"/>
      <stop offset="0.4" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
      <stop offset="1"   stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-api"><rect x="20" y="252" width="360" height="175" rx="3"/></clipPath>
    <clipPath id="clip-plat"><rect x="20" y="450" width="360" height="82"  rx="3"/></clipPath>
  </defs>

  <!-- Zone tints -->
  <rect class="aif-zone-v" x="0" y="0"   width="400" height="200" fill="#5e8570" fill-opacity="0.05" rx="4"/>
  <rect class="aif-zone-c" x="0" y="210" width="400" height="330" fill="#C9A874" fill-opacity="0.04" rx="4"/>

  <!-- Validated Run -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
    <rect class="aif-box-bg-v"     x="20" y="25" width="360" height="72" rx="3" fill="#5e8570" fill-opacity="0.08"/>
    <rect class="aif-box-border-v" x="20" y="25" width="360" height="72" rx="3" fill="none"
          stroke="#5e8570" stroke-width="1.5" stroke-opacity="0.5" filter="url(#gv)"/>
    <text class="aif-title-v svg-title" x="200" y="56" text-anchor="middle" font-size="17" font-weight="600" fill="#f2e9de">Validated Run</text>
    <text class="aif-sub-v svg-label"   x="200" y="77" text-anchor="middle" font-size="10.5" letter-spacing="0.8" fill="#5e8570" fill-opacity="0.8">captured · normalized · checksummed</text>
  </g>

  <!-- Arrow 1 -->
  <line class="aif-arrow-v" x1="200" y1="97" x2="200" y2="97" stroke="#5e8570" stroke-width="1.5"
        stroke-opacity="0" marker-end="url(#av)">
    <animate attributeName="stroke-opacity" from="0" to="0.6" begin="1s" dur="0.3s" fill="freeze"/>
    <animate attributeName="y2" from="97" to="120" begin="0.9s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- astrolabe upload -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
    <rect class="aif-box-bg-c"     x="20" y="122" width="360" height="50" rx="3" fill="#C9A874" fill-opacity="0.07"/>
    <rect class="aif-box-border-c" x="20" y="122" width="360" height="50" rx="3" fill="none"
          stroke="#C9A874" stroke-width="1.5" stroke-opacity="0.6" filter="url(#gc)"/>
    <text class="aif-sub-c svg-code" x="200" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#C9A874">astrolabe upload</text>
  </g>

  <!-- Arrow crossing to remote -->
  <line class="aif-arrow-c" x1="200" y1="174" x2="200" y2="248" stroke="#C9A874" stroke-width="2"
        stroke-opacity="0" marker-end="url(#ac)">
    <animate attributeName="stroke-opacity" from="0" to="0.85" begin="1.8s" dur="0.4s" fill="freeze"/>
  </line>

  <!-- Orrery API box -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    <rect class="aif-box-bg-c"     x="20" y="252" width="360" height="175" rx="3" fill="#C9A874" fill-opacity="0.06"/>
    <rect class="aif-box-border-c" x="20" y="252" width="360" height="175" rx="3" fill="none"
          stroke="#C9A874" stroke-width="1.5" stroke-opacity="0.55" filter="url(#gc)"/>
    <text class="aif-title-c svg-title" x="200" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#C9A874">Orrery API</text>
  </g>

  <!-- API step 1 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.4s" fill="freeze"/>
    <rect class="aif-step-bg" x="36" y="284" width="328" height="30" rx="2" fill="#C9A874" fill-opacity="0.07"/>
    <text class="aif-step-num svg-label" x="56" y="304" font-size="11" font-weight="700" fill="#C9A874" fill-opacity="0.6">1.</text>
    <text class="aif-step-text svg-label" x="74" y="304" font-size="11" fill="#C9B98A">Create run</text>
  </g>
  <!-- API step 2 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3s" dur="0.4s" fill="freeze"/>
    <rect class="aif-step-bg" x="36" y="318" width="328" height="30" rx="2" fill="#C9A874" fill-opacity="0.07"/>
    <text class="aif-step-num svg-label" x="56" y="338" font-size="11" font-weight="700" fill="#C9A874" fill-opacity="0.6">2.</text>
    <text class="aif-step-text svg-label" x="74" y="338" font-size="11" fill="#C9B98A">Presign artifacts</text>
  </g>
  <!-- API step 3 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
    <rect class="aif-step-bg" x="36" y="352" width="328" height="30" rx="2" fill="#C9A874" fill-opacity="0.07"/>
    <text class="aif-step-num svg-label" x="56" y="372" font-size="11" font-weight="700" fill="#C9A874" fill-opacity="0.6">3.</text>
    <text class="aif-step-text svg-label" x="74" y="372" font-size="11" fill="#C9B98A">Upload to storage</text>
  </g>
  <!-- API step 4 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.4s" fill="freeze"/>
    <rect class="aif-step-bg" x="36" y="386" width="328" height="30" rx="2" fill="#C9A874" fill-opacity="0.07"/>
    <text class="aif-step-num svg-label" x="56" y="406" font-size="11" font-weight="700" fill="#C9A874" fill-opacity="0.6">4.</text>
    <text class="aif-step-text svg-label" x="74" y="406" font-size="11" fill="#C9B98A">Confirm</text>
  </g>

  <!-- Step connector ticks -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="0.35" begin="4.2s" dur="0.5s" fill="freeze"/>
    <line class="aif-tick" x1="50" y1="314" x2="50" y2="318" stroke="#C9A874" stroke-width="1"/>
    <line class="aif-tick" x1="50" y1="348" x2="50" y2="352" stroke="#C9A874" stroke-width="1"/>
    <line class="aif-tick" x1="50" y1="382" x2="50" y2="386" stroke="#C9A874" stroke-width="1"/>
  </g>

  <!-- Arrow to platform -->
  <line class="aif-arrow-c" x1="200" y1="429" x2="200" y2="448" stroke="#C9A874" stroke-width="2"
        stroke-opacity="0" marker-end="url(#ac)">
    <animate attributeName="stroke-opacity" from="0" to="0.9" begin="4.4s" dur="0.4s" fill="freeze"/>
  </line>

  <!-- Orrery Platform hero card -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.7s" fill="freeze"/>
    <rect class="aif-box-bg-c"     x="20" y="450" width="360" height="82" rx="3" fill="#C9A874" fill-opacity="0.10"/>
    <rect class="aif-box-border-c" x="20" y="450" width="360" height="82" rx="3" fill="none"
          stroke="#C9A874" stroke-width="2" filter="url(#gcs)"/>
    <text class="aif-title-c svg-title" x="200" y="492" text-anchor="middle" font-size="21" font-weight="700" fill="#C9A874">Orrery Platform</text>
    <text class="aif-sub-c svg-label"   x="200" y="515" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#C9A874" fill-opacity="0.65">review · triage · reporting</text>
  </g>

  <!-- Shimmer sweeps -->
  <rect x="20" y="252" width="360" height="175" rx="3" fill="url(#shimmer)"
        clip-path="url(#clip-api)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="-400,0" to="400,0" dur="0.8s" begin="9s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>
  <rect x="20" y="450" width="360" height="82" rx="3" fill="url(#shimmer)"
        clip-path="url(#clip-plat)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="9.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="-400,0" to="400,0" dur="0.8s" begin="9.3s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>

  <!-- Idle: Validated Run glow pulse -->
  <rect class="aif-pulse-v" x="20" y="25" width="360" height="72" rx="3" fill="none"
        stroke="#5e8570" stroke-width="1.5" stroke-opacity="0">
    <animate attributeName="stroke-opacity" values="0;0.35;0" dur="4s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Idle: Platform fill pulse -->
  <rect class="aif-idle-fill" x="20" y="450" width="360" height="82" rx="3" fill="#C9A874" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0.10;0.18;0.10" dur="5s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Idle: travelling dot on upload arrow -->
  <circle class="aif-dot-c" r="2.5" fill="#C9A874" cx="200" cy="174" opacity="0">
    <animate attributeName="cy"      values="174;248" dur="1.2s" begin="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="1.2s" begin="11s" repeatCount="indefinite"/>
  </circle>
</svg>
