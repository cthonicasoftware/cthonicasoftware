<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%"
     role="img" aria-label="How it works: Capture, Upload, Analyze, Ship"
     class="lazy-svg">
  <defs>
    <style>
      .hiw-title { font-family: 'EB Garamond', Georgia, serif; }
      .hiw-label { font-family: 'EB Garamond', Georgia, serif; }

      /* ── Light mode overrides ── */
      :root:not(.dark) .hiw-zone-v        { fill: #3a5e47; fill-opacity: 0.05; }
      :root:not(.dark) .hiw-zone-c        { fill: #8b6020; fill-opacity: 0.05; }
      :root:not(.dark) .hiw-divider       { stroke: #8b6020; stroke-opacity: 0.20; }

      :root:not(.dark) .hiw-card-bg-v     { fill: #3a5e47; fill-opacity: 0.08; }
      :root:not(.dark) .hiw-card-border-v { stroke: #3a5e47; stroke-opacity: 0.40; }
      :root:not(.dark) .hiw-card-bg-c     { fill: #8b6020; fill-opacity: 0.08; }
      :root:not(.dark) .hiw-card-border-c { stroke: #8b6020; stroke-opacity: 0.50; filter: none; }

      :root:not(.dark) .hiw-num-v         { fill: #3a5e47; fill-opacity: 0.55; }
      :root:not(.dark) .hiw-num-c         { fill: #8b6020; fill-opacity: 0.65; }

      :root:not(.dark) .hiw-heading       { fill: #2a1a06; }
      :root:not(.dark) .hiw-heading-ship  { fill: #6b4a18; }
      :root:not(.dark) .hiw-sub-v         { fill: #3a5e47; fill-opacity: 1; }
      :root:not(.dark) .hiw-sub-c         { fill: #8b6020; fill-opacity: 1; }
      :root:not(.dark) .hiw-desc          { fill: #5c4228; }
      :root:not(.dark) .hiw-desc-ship     { fill: #8b6020; }

      :root:not(.dark) .hiw-zone-label-v  { fill: #3a5e47; fill-opacity: 0.65; }
      :root:not(.dark) .hiw-zone-label-c  { fill: #8b6020; fill-opacity: 0.65; }

      :root:not(.dark) .hiw-arrow-v       { stroke: #3a5e47; stroke-opacity: 0.65; }
      :root:not(.dark) .hiw-arrow-m       { stroke: #5e8570; stroke-opacity: 0.60; }
      :root:not(.dark) .hiw-arrow-c       { stroke: #8b6020; stroke-opacity: 0.80; }
      :root:not(.dark) .hiw-dot-c         { fill: #8b6020; }
      :root:not(.dark) .hiw-idle-fill     { fill: #8b6020; }
    </style>

    <filter id="hiw-gv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#5e8570" flood-opacity="0.4"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="hiw-gc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#C9A874" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="hiw-av" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5e8570" opacity="0.7"/>
    </marker>
    <marker id="hiw-am" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#5e8570" opacity="0.8"/>
    </marker>
    <marker id="hiw-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#C9A874"/>
    </marker>

    <linearGradient id="hiw-shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="white" stop-opacity="0"/>
      <stop offset="0.4" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
      <stop offset="1"   stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hiw-clip-ship"><rect x="600" y="32" width="152" height="170" rx="3"/></clipPath>

  </defs>

  <!-- Zone tints -->
  <rect class="hiw-zone-v" x="0"   y="0" width="400" height="240" fill="#5e8570" fill-opacity="0.03" rx="4"/>
  <rect class="hiw-zone-c" x="400" y="0" width="400" height="240" fill="#C9A874" fill-opacity="0.03" rx="4"/>

  <!-- Zone divider -->
  <line class="hiw-divider" x1="400" y1="16" x2="400" y2="224"
        stroke="#9CA3AF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Zone labels -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
    <text class="hiw-zone-label-v hiw-label" x="216" y="16" text-anchor="middle"
          font-size="8" font-weight="700" fill="#5e8570" fill-opacity="0.5" letter-spacing="2.5">ASTROLABE</text>
    <text class="hiw-zone-label-c hiw-label" x="584" y="16" text-anchor="middle"
          font-size="8" font-weight="700" fill="#C9A874" fill-opacity="0.5" letter-spacing="2.5">ORRERY</text>
  </g>

  <!-- Card 1: Capture -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.3s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect class="hiw-card-bg-v"     x="48" y="32" width="152" height="170" rx="3" fill="#5e8570" fill-opacity="0.07"/>
      <rect class="hiw-card-border-v" x="48" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#5e8570" stroke-width="1.5" stroke-opacity="0.45"/>
      <text class="hiw-num-v hiw-label"  x="62"  y="58"  font-size="10" font-weight="700" fill="#5e8570" fill-opacity="0.4">01</text>
      <text class="hiw-heading hiw-title" x="124" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#f2e9de">Capture</text>
      <text class="hiw-sub-v hiw-label"  x="124" y="130" text-anchor="middle" font-size="10" fill="#5e8570">Records hardware test data</text>
      <text class="hiw-desc hiw-label"   x="124" y="172" text-anchor="middle" font-size="9"  fill="#9CA3AF">serial · TCP · file</text>
    </g>
  </g>

  <!-- Card 2: Upload -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.6s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect class="hiw-card-bg-v"     x="232" y="32" width="152" height="170" rx="3" fill="#5e8570" fill-opacity="0.07"/>
      <rect class="hiw-card-border-v" x="232" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#5e8570" stroke-width="1.5" stroke-opacity="0.45"/>
      <text class="hiw-num-v hiw-label"  x="246" y="58"  font-size="10" font-weight="700" fill="#5e8570" fill-opacity="0.4">02</text>
      <text class="hiw-heading hiw-title" x="308" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#f2e9de">Upload</text>
      <text class="hiw-sub-v hiw-label"  x="308" y="130" text-anchor="middle" font-size="10" fill="#5e8570">Delivers runs to Orrery</text>
      <text class="hiw-desc hiw-label"   x="308" y="172" text-anchor="middle" font-size="9"  fill="#9CA3AF">retry · resume · verified</text>
    </g>
  </g>

  <!-- Card 3: Analyze -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.9s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect class="hiw-card-bg-c"     x="416" y="32" width="152" height="170" rx="3" fill="#C9A874" fill-opacity="0.07"/>
      <rect class="hiw-card-border-c" x="416" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#C9A874" stroke-width="1.5" stroke-opacity="0.45"/>
      <text class="hiw-num-c hiw-label"       x="430" y="58"  font-size="10" font-weight="700" fill="#C9A874" fill-opacity="0.4">03</text>
      <text class="hiw-heading hiw-title"      x="492" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#f2e9de">Analyze</text>
      <text class="hiw-sub-c hiw-label"        x="492" y="130" text-anchor="middle" font-size="10" fill="#C9A874">Normalize, run AI analysis</text>
      <text class="hiw-desc hiw-label"         x="492" y="172" text-anchor="middle" font-size="9"  fill="#9CA3AF">features · AI · rules</text>
    </g>
  </g>

  <!-- Card 4: Ship (hero) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="1.2s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect class="hiw-card-bg-c"     x="600" y="32" width="152" height="170" rx="3" fill="#C9A874" fill-opacity="0.09"/>
      <rect class="hiw-card-border-c" x="600" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#C9A874" stroke-width="2" filter="url(#hiw-gc)"/>
      <text class="hiw-num-c hiw-label"        x="614" y="58"  font-size="10" font-weight="700" fill="#C9A874" fill-opacity="0.5">04</text>
      <text class="hiw-heading-ship hiw-title"  x="676" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#C9A874">Ship</text>
      <text class="hiw-sub-c hiw-label"         x="676" y="130" text-anchor="middle" font-size="10" fill="#C9A874">Make release decisions</text>
      <text class="hiw-desc-ship hiw-label"     x="676" y="172" text-anchor="middle" font-size="9"  fill="#C9B98A">query · decide · release</text>
    </g>
  </g>

  <!-- Arrow 1: Capture → Upload (verdigris) -->
  <line class="hiw-arrow-v" x1="200" y1="117" x2="224" y2="117"
        stroke="#5e8570" stroke-width="1.5" stroke-opacity="0.7"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#hiw-av)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Arrow 2: Upload → Analyze (handoff, mixed tone) -->
  <line class="hiw-arrow-m" x1="384" y1="117" x2="408" y2="117"
        stroke="#5e8570" stroke-width="1.5" stroke-opacity="0.7"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#hiw-am)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.3s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Arrow 3: Analyze → Ship (celestial) -->
  <line class="hiw-arrow-c" x1="568" y1="117" x2="592" y2="117"
        stroke="#C9A874" stroke-width="2" stroke-opacity="0.9"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#hiw-ac)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.6s" dur="0.5s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Shimmer across Ship card -->
  <rect x="600" y="32" width="152" height="170" rx="3" fill="url(#hiw-shimmer)"
        clip-path="url(#hiw-clip-ship)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="-800,0" to="800,0" dur="0.8s" begin="9s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>

  <!-- Idle: Ship card breathes -->
  <rect class="hiw-idle-fill" x="600" y="32" width="152" height="170" rx="3" fill="#C9A874" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0.09;0.18;0.09" dur="5s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Idle: travelling dot on last arrow -->
  <circle class="hiw-dot-c" r="3" fill="#C9A874" cx="568" cy="117" opacity="0">
    <animate attributeName="cx"      values="568;592" dur="1s" begin="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0"  dur="1s" begin="11s" repeatCount="indefinite"/>
  </circle>
</svg>
