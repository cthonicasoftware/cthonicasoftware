<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%"
     role="img" aria-label="How it works: Capture, Upload, Analyze, Ship"
     class="lazy-svg">
  <defs>
    <style>
      .hiw-title { font-family: 'EB Garamond', Georgia, serif; }
      .hiw-label { font-family: system-ui, sans-serif; }
    </style>

    <filter id="hiw-gv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#3D9E8C" flood-opacity="0.4"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="hiw-gc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#C9A874" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="hiw-av" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3D9E8C" opacity="0.7"/>
    </marker>
    <marker id="hiw-am" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#8AB49C" opacity="0.8"/>
    </marker>
    <marker id="hiw-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#C9A874"/>
    </marker>

    <linearGradient id="hiw-shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="white" stop-opacity="0"/>
      <stop offset="0.4" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
      <stop offset="1"   stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hiw-clip-ship"><rect x="600" y="32" width="152" height="170" rx="3"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="#0D1117" rx="4"/>

  <!-- Zone tints -->
  <rect x="0"   y="0" width="400" height="240" fill="#3D9E8C" fill-opacity="0.03" rx="4"/>
  <rect x="400" y="0" width="400" height="240" fill="#C9A874" fill-opacity="0.03" rx="4"/>

  <!-- Zone divider -->
  <line x1="400" y1="16" x2="400" y2="224" stroke="#9CA3AF" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Zone labels -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
    <text x="216" y="16" text-anchor="middle" font-size="8" font-weight="700"
          fill="#3D9E8C" fill-opacity="0.5" letter-spacing="2.5" class="hiw-label">ASTROLABE</text>
    <text x="584" y="16" text-anchor="middle" font-size="8" font-weight="700"
          fill="#C9A874" fill-opacity="0.5" letter-spacing="2.5" class="hiw-label">ORRERY</text>
  </g>

  <!-- Card 1: Capture -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.3s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="48" y="32" width="152" height="170" rx="3" fill="#3D9E8C" fill-opacity="0.07"/>
      <rect x="48" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.45"/>
      <text x="62"  y="58"  font-size="10" font-weight="700" fill="#3D9E8C" fill-opacity="0.4" class="hiw-label">01</text>
      <text x="124" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#C8DDD9" class="hiw-title">Capture</text>
      <text x="124" y="130" text-anchor="middle" font-size="10" fill="#3D9E8C" class="hiw-label">Records hardware test data</text>
      <text x="124" y="172" text-anchor="middle" font-size="9"  fill="#9CA3AF" class="hiw-label">serial · TCP · file</text>
    </g>
  </g>

  <!-- Card 2: Upload -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.6s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="232" y="32" width="152" height="170" rx="3" fill="#3D9E8C" fill-opacity="0.07"/>
      <rect x="232" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.45"/>
      <text x="246" y="58"  font-size="10" font-weight="700" fill="#3D9E8C" fill-opacity="0.4" class="hiw-label">02</text>
      <text x="308" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#C8DDD9" class="hiw-title">Upload</text>
      <text x="308" y="130" text-anchor="middle" font-size="10" fill="#3D9E8C" class="hiw-label">Delivers runs to Orrery</text>
      <text x="308" y="172" text-anchor="middle" font-size="9"  fill="#9CA3AF" class="hiw-label">retry · resume · verified</text>
    </g>
  </g>

  <!-- Card 3: Analyze -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.9s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="416" y="32" width="152" height="170" rx="3" fill="#C9A874" fill-opacity="0.07"/>
      <rect x="416" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#C9A874" stroke-width="1.5" stroke-opacity="0.45"/>
      <text x="430" y="58"  font-size="10" font-weight="700" fill="#C9A874" fill-opacity="0.4" class="hiw-label">03</text>
      <text x="492" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#C8DDD9" class="hiw-title">Analyze</text>
      <text x="492" y="130" text-anchor="middle" font-size="10" fill="#C9A874" class="hiw-label">Normalize, run AI analysis</text>
      <text x="492" y="172" text-anchor="middle" font-size="9"  fill="#9CA3AF" class="hiw-label">features · AI · rules</text>
    </g>
  </g>

  <!-- Card 4: Ship (hero) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="1.2s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="600" y="32" width="152" height="170" rx="3" fill="#C9A874" fill-opacity="0.09"/>
      <rect x="600" y="32" width="152" height="170" rx="3" fill="none"
            stroke="#C9A874" stroke-width="2" filter="url(#hiw-gc)"/>
      <text x="614" y="58"  font-size="10" font-weight="700" fill="#C9A874" fill-opacity="0.5" class="hiw-label">04</text>
      <text x="676" y="107" text-anchor="middle" font-size="21" font-weight="700" fill="#C9A874" class="hiw-title">Ship</text>
      <text x="676" y="130" text-anchor="middle" font-size="10" fill="#C9A874" class="hiw-label">Make release decisions</text>
      <text x="676" y="172" text-anchor="middle" font-size="9"  fill="#C9B98A" class="hiw-label">query · decide · release</text>
    </g>
  </g>

  <!-- Arrow 1: Capture → Upload (verdigris) -->
  <line x1="200" y1="117" x2="224" y2="117"
        stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.7"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#hiw-av)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Arrow 2: Upload → Analyze (handoff, mixed tone) -->
  <line x1="384" y1="117" x2="408" y2="117"
        stroke="#8AB49C" stroke-width="1.5" stroke-opacity="0.7"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#hiw-am)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.3s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Arrow 3: Analyze → Ship (celestial) -->
  <line x1="568" y1="117" x2="592" y2="117"
        stroke="#C9A874" stroke-width="2" stroke-opacity="0.9"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#hiw-ac)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.6s" dur="0.5s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Shimmer across Ship card -->
  <rect x="600" y="32" width="152" height="170" rx="3" fill="url(#hiw-shimmer)"
        clip-path="url(#hiw-clip-ship)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="-800,0" to="800,0" dur="0.8s" begin="9s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>

  <!-- Idle: Ship card breathes -->
  <rect x="600" y="32" width="152" height="170" rx="3" fill="#C9A874" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0.09;0.18;0.09" dur="5s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Idle: travelling dot on last arrow -->
  <circle r="3" fill="#C9A874" cx="568" cy="117" opacity="0">
    <animate attributeName="cx"      values="568;592" dur="1s" begin="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0"  dur="1s" begin="11s" repeatCount="indefinite"/>
  </circle>
</svg>
