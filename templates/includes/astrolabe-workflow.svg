<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%"
     role="img" aria-label="Astrolabe operational workflow: Configure, Capture, Verify, Upload"
     class="lazy-svg">
  <defs>
    <style>
      .wf-title { font-family: 'EB Garamond', Georgia, serif; }
      .wf-code  { font-family: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace; }
      .wf-label { font-family: system-ui, sans-serif; }
    </style>

    <filter id="wf-gv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#3D9E8C" flood-opacity="0.4"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="wf-gc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#C9A874" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="wf-av" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3D9E8C" opacity="0.7"/>
    </marker>
    <marker id="wf-ac" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#C9A874"/>
    </marker>

    <linearGradient id="wf-shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="white" stop-opacity="0"/>
      <stop offset="0.4" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="white" stop-opacity="0"/>
      <stop offset="1"   stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="wf-clip-upload"><rect x="600" y="40" width="152" height="162" rx="3"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="240" fill="#0D1117" rx="4"/>

  <!-- Card 1: Configure -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.3s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="48" y="40" width="152" height="162" rx="3" fill="#3D9E8C" fill-opacity="0.07"/>
      <rect x="48" y="40" width="152" height="162" rx="3" fill="none"
            stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.45"/>
      <text x="62"  y="67" font-size="10" font-weight="700" fill="#3D9E8C" fill-opacity="0.4" class="wf-label">01</text>
      <text x="124" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#C8DDD9" class="wf-title">Configure</text>
      <text x="124" y="135" text-anchor="middle" font-size="10.5" fill="#3D9E8C" class="wf-code">astrolabe config</text>
      <text x="124" y="170" text-anchor="middle" font-size="9" fill="#9CA3AF" class="wf-label">profiles · credentials · defaults</text>
    </g>
  </g>

  <!-- Card 2: Capture -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.6s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="232" y="40" width="152" height="162" rx="3" fill="#3D9E8C" fill-opacity="0.07"/>
      <rect x="232" y="40" width="152" height="162" rx="3" fill="none"
            stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.45"/>
      <text x="246" y="67" font-size="10" font-weight="700" fill="#3D9E8C" fill-opacity="0.4" class="wf-label">02</text>
      <text x="308" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#C8DDD9" class="wf-title">Capture</text>
      <text x="308" y="135" text-anchor="middle" font-size="10.5" fill="#3D9E8C" class="wf-code">astrolabe capture</text>
      <text x="308" y="170" text-anchor="middle" font-size="9" fill="#9CA3AF" class="wf-label">serial · TCP · file · offline</text>
    </g>
  </g>

  <!-- Card 3: Verify -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="0.9s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="416" y="40" width="152" height="162" rx="3" fill="#3D9E8C" fill-opacity="0.07"/>
      <rect x="416" y="40" width="152" height="162" rx="3" fill="none"
            stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.45"/>
      <text x="430" y="67" font-size="10" font-weight="700" fill="#3D9E8C" fill-opacity="0.4" class="wf-label">03</text>
      <text x="492" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#C8DDD9" class="wf-title">Verify</text>
      <text x="492" y="135" text-anchor="middle" font-size="10.5" fill="#3D9E8C" class="wf-code">astrolabe validate</text>
      <text x="492" y="170" text-anchor="middle" font-size="9" fill="#9CA3AF" class="wf-label">checksums · manifest · schema</text>
    </g>
  </g>

  <!-- Card 4: Upload (celestial) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.6s" fill="freeze"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,70" to="0,0" begin="1.2s" dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
      <rect x="600" y="40" width="152" height="162" rx="3" fill="#C9A874" fill-opacity="0.09"/>
      <rect x="600" y="40" width="152" height="162" rx="3" fill="none"
            stroke="#C9A874" stroke-width="2" filter="url(#wf-gc)"/>
      <text x="614" y="67" font-size="10" font-weight="700" fill="#C9A874" fill-opacity="0.5" class="wf-label">04</text>
      <text x="676" y="112" text-anchor="middle" font-size="21" font-weight="700" fill="#C9A874" class="wf-title">Upload</text>
      <text x="676" y="135" text-anchor="middle" font-size="10.5" fill="#C9A874" class="wf-code">astrolabe upload</text>
      <text x="676" y="170" text-anchor="middle" font-size="9" fill="#C9B98A" class="wf-label">retry · resume · dedup</text>
    </g>
  </g>

  <!-- Arrow 1: Configure → Capture -->
  <line x1="200" y1="121" x2="224" y2="121"
        stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.7"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#wf-av)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Arrow 2: Capture → Verify -->
  <line x1="384" y1="121" x2="408" y2="121"
        stroke="#3D9E8C" stroke-width="1.5" stroke-opacity="0.7"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#wf-av)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.3s" dur="0.4s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Arrow 3: Verify → Upload (celestial) -->
  <line x1="568" y1="121" x2="592" y2="121"
        stroke="#C9A874" stroke-width="2" stroke-opacity="0.9"
        stroke-dasharray="40" stroke-dashoffset="40" marker-end="url(#wf-ac)">
    <animate attributeName="stroke-dashoffset" from="40" to="0" begin="2.6s" dur="0.5s" fill="freeze"
             calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </line>

  <!-- Shimmer across Upload card -->
  <rect x="600" y="40" width="152" height="162" rx="3" fill="url(#wf-shimmer)"
        clip-path="url(#wf-clip-upload)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="0.6s" begin="9s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="-800,0" to="800,0" dur="0.8s" begin="9s" fill="freeze"
      calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
  </rect>

  <!-- Idle: Upload card breathes -->
  <rect x="600" y="40" width="152" height="162" rx="3" fill="#C9A874" fill-opacity="0">
    <animate attributeName="fill-opacity" values="0.09;0.18;0.09" dur="5s" begin="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Idle: travelling dot on arrow 3 -->
  <circle r="3" fill="#C9A874" cx="568" cy="121" opacity="0">
    <animate attributeName="cx"      values="568;592" dur="1s" begin="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="1s" begin="11s" repeatCount="indefinite"/>
  </circle>
</svg>
