<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900"
     preserveAspectRatio="xMidYMid slice"
     class="page-bg-svg"
     style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;">
  <style>
    /* ── Light mode — shift from dark starfield to faint parchment orrery ── */
    :root:not(.dark) .star-w  { fill: #6b3f14; }
    :root:not(.dark) .star-g  { fill: #7a4e10; }
    :root:not(.dark) .star-t  { fill: #3a5e47; }
    :root:not(.dark) .stars   { opacity: 0.18; }

    :root:not(.dark) .center-glow { fill: url(#bg-center-light); }

    :root:not(.dark) .orb-cross { stroke: #8b5e1a; }
    :root:not(.dark) .orb-ring  { stroke: #8b5e1a; }

    :root:not(.dark) .planet-v-halo, :root:not(.dark) .planet-v-core { fill: #3a5e47; }
    :root:not(.dark) .planet-g-halo, :root:not(.dark) .planet-g-core { fill: #7a4e10; }
  </style>
  <defs>
    <!-- Dark mode center glow — verdigris -->
    <radialGradient id="bg-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5e8570" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5e8570" stop-opacity="0"/>
    </radialGradient>
    <!-- Light mode center glow — warm amber -->
    <radialGradient id="bg-center-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c6a664" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#c6a664" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Stars layer ── -->
  <g class="stars" opacity="0.35">
    <circle class="star-g" cx="216"  cy="90"  r="1.5" fill="#C9A874"><animate attributeName="opacity" values="0.2;0.9;0.3;0.8;0.1" dur="4.2s" begin="0s"    repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="1152" cy="180" r="1.2" fill="#ffffff" ><animate attributeName="opacity" values="0.3;0.8;0.1;0.9;0.2" dur="3.7s" begin="0.8s"  repeatCount="indefinite"/></circle>
    <circle class="star-g" cx="648"  cy="135" r="1.8" fill="#C9A874"><animate attributeName="opacity" values="0.1;0.7;0.4;0.9;0.2" dur="5.1s" begin="1.4s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="360"  cy="540" r="1.3" fill="#ffffff" ><animate attributeName="opacity" values="0.5;0.1;0.8;0.3;0.7" dur="3.9s" begin="0.3s"  repeatCount="indefinite"/></circle>
    <circle class="star-t" cx="936"  cy="630" r="1.5" fill="#5e8570"><animate attributeName="opacity" values="0.2;0.8;0.1;0.6;0.3" dur="4.8s" begin="2.1s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="576"  cy="765" r="1.0" fill="#ffffff" ><animate attributeName="opacity" values="0.4;0.9;0.2;0.7;0.5" dur="3.3s" begin="1.7s"  repeatCount="indefinite"/></circle>
    <circle class="star-g" cx="1296" cy="270" r="2.0" fill="#C9A874"><animate attributeName="opacity" values="0.1;0.6;0.3;0.8;0.2" dur="5.5s" begin="0.6s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="144"  cy="450" r="1.2" fill="#ffffff" ><animate attributeName="opacity" values="0.6;0.2;0.9;0.4;0.7" dur="4.1s" begin="2.5s"  repeatCount="indefinite"/></circle>
    <circle class="star-t" cx="1008" cy="360" r="1.5" fill="#5e8570"><animate attributeName="opacity" values="0.3;0.7;0.1;0.8;0.4" dur="3.6s" begin="1.2s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="1224" cy="675" r="1.1" fill="#ffffff" ><animate attributeName="opacity" values="0.8;0.2;0.6;0.1;0.9" dur="4.4s" begin="0.4s"  repeatCount="indefinite"/></circle>
    <circle class="star-g" cx="504"  cy="225" r="2.2" fill="#C9A874"><animate attributeName="opacity" values="0.2;0.9;0.4;0.7;0.1" dur="5.8s" begin="1.9s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="288"  cy="810" r="1.3" fill="#ffffff" ><animate attributeName="opacity" values="0.4;0.1;0.8;0.3;0.6" dur="3.2s" begin="0.9s"  repeatCount="indefinite"/></circle>
    <circle class="star-t" cx="864"  cy="108" r="1.7" fill="#5e8570"><animate attributeName="opacity" values="0.7;0.3;0.9;0.2;0.5" dur="4.6s" begin="2.3s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="720"  cy="495" r="1.0" fill="#ffffff" ><animate attributeName="opacity" values="0.1;0.7;0.4;0.9;0.3" dur="3.8s" begin="1.6s"  repeatCount="indefinite"/></circle>
    <circle class="star-g" cx="1080" cy="720" r="1.4" fill="#C9A874"><animate attributeName="opacity" values="0.3;0.8;0.2;0.6;0.4" dur="5.2s" begin="0.1s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="72"   cy="315" r="1.8" fill="#ffffff" ><animate attributeName="opacity" values="0.6;0.1;0.7;0.3;0.8" dur="4.0s" begin="2.8s"  repeatCount="indefinite"/></circle>
    <circle class="star-t" cx="1368" cy="585" r="1.2" fill="#5e8570"><animate attributeName="opacity" values="0.2;0.7;0.5;0.9;0.1" dur="3.5s" begin="1.1s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="432"  cy="405" r="1.6" fill="#ffffff" ><animate attributeName="opacity" values="0.5;0.2;0.8;0.4;0.7" dur="4.7s" begin="0.5s"  repeatCount="indefinite"/></circle>
    <circle class="star-g" cx="792"  cy="855" r="1.0" fill="#C9A874"><animate attributeName="opacity" values="0.4;0.9;0.1;0.6;0.3" dur="3.4s" begin="2.0s"  repeatCount="indefinite"/></circle>
    <circle class="star-w" cx="1224" cy="45"  r="2.0" fill="#ffffff" ><animate attributeName="opacity" values="0.1;0.6;0.9;0.2;0.7" dur="5.0s" begin="1.3s"  repeatCount="indefinite"/></circle>
  </g>

  <!-- ── Center ambient glow ── -->
  <ellipse class="center-glow" cx="720" cy="450" rx="200" ry="200" fill="url(#bg-center)"/>
</svg>
